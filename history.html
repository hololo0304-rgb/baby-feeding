<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餵奶歷史紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #FFF5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen text-gray-700">

  <!-- 標題與返回 -->
  <div class="flex items-center justify-between mb-4">
    <a href="index.html" class="bg-white border border-pink-200 px-4 py-2 rounded-2xl text-sm font-bold text-pink-400 hover:bg-pink-50">
      ← 返回新增
    </a>
    <h1 class="font-bold text-lg text-gray-800">📜 全部歷史紀錄</h1>
    <div class="w-16"></div>
  </div>

  <!-- 今日統計 -->
  <div class="bg-white rounded-3xl p-4 shadow-sm border border-red-50 mb-4 flex justify-around text-center">
    <div>
      <div class="text-xs text-gray-400 font-semibold mb-1">今日總喝量</div>
      <div id="todayTotal" class="text-xl font-bold text-pink-500">0 ml</div>
    </div>
    <div class="border-r border-gray-100"></div>
    <div>
      <div class="text-xs text-gray-400 font-semibold mb-1">今日總餐數</div>
      <div id="todayCount" class="text-xl font-bold text-blue-500">0 餐</div>
    </div>
  </div>

  <!-- 紀錄列表 -->
  <div class="bg-white rounded-3xl p-5 shadow-sm border border-red-50">
    <div id="historyList" class="space-y-3">
      <div class="text-center py-8 text-gray-400">載入歷史紀錄中...</div>
    </div>
  </div>

  <script>
    // 請替換為您的 GAS Web App 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz_REPLACE_WITH_YOUR_GAS_ID/exec';

    window.onload = fetchHistory;

    async function fetchHistory() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.status === 'success') {
          renderList(data.records);
          calculateToday(data.records);
        }
      } catch (err) {
        document.getElementById('historyList').innerHTML = '<div class="text-center py-4 text-red-400">無法載入紀錄</div>';
      }
    }

    function calculateToday(records) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayRecords = records.filter(r => r.timeStr.startsWith(todayStr));
      
      const totalVolume = todayRecords.reduce((sum, r) => sum + Number(r.actualAmount || 0), 0);
      
      document.getElementById('todayTotal').innerText = `${totalVolume} ml`;
      document.getElementById('todayCount').innerText = `${todayRecords.length} 餐`;
    }

    function renderList(records) {
      const listEl = document.getElementById('historyList');
      if (!records || records.length === 0) {
        listEl.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm">無歷史紀錄</div>';
        return;
      }

      listEl.innerHTML = records.map(r => `
        <div class="bg-red-50/40 rounded-2xl p-3 flex justify-between items-center border border-red-100">
          <div>
            <div class="font-bold text-gray-700 text-sm">⏰ ${r.type}</div>
            <div class="text-xs text-gray-400 mt-0.5">泡 ${r.prepAmount} ml | 剩 ${r.restAmount} ml</div>
            <div class="text-xs text-gray-500 mt-0.5">${r.timeStr}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-pink-500 text-base">${r.actualAmount} ml</span>
            <button onclick="deleteRecord('${r.id}')" class="text-gray-300 hover:text-red-400 p-1">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteRecord(id) {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
        alert('已刪除');
        fetchHistory();
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }
  </script>
</body>
</html>
