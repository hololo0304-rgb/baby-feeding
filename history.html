<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史紀錄 - 寶寶餵奶紀錄</title>
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F5F7FA;
      --card-bg: #FFFFFF;
      --text: #333333;
      --border: #E1E6EB;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    .btn-back {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      font-weight: bold;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    /* 精簡緊湊歷史清單項目 */
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .history-item:last-child { border-bottom: none; }
    .tag {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #E8F2FF;
      color: var(--primary);
      margin-right: 6px;
    }
    .time { color: #555; margin-right: 6px; }
    .amount { font-weight: bold; }
    .btn-del {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部導覽 -->
    <a href="index.html" class="btn-back">⬅️ 返回首頁紀錄頁面</a>

    <!-- 完整歷史清單 -->
    <div class="card">
      <h3 style="margin-top:0; font-size:1rem; padding-bottom:8px; border-bottom:1px solid var(--border);">完整雲端歷史紀錄</h3>
      <div id="historyList">讀取中...</div>
    </div>
  </div>

  <script>
    const GAS_URL = "YOUR_GAS_WEB_APP_URL"; // 替換為實際 GAS URL

    document.addEventListener("DOMContentLoaded", () => {
      loadHistory();
    });

    function getLocalRecords() {
      return JSON.parse(localStorage.getItem('baby_records') || '[]');
    }

    function saveLocalRecords(data) {
      localStorage.setItem('baby_records', JSON.stringify(data));
      renderList();
    }

    async function loadHistory() {
      renderList(); // 先展示本地快照
      try {
        const res = await fetch(GAS_URL);
        const json = await res.json();
        if (json.status === 'success') {
          saveLocalRecords(json.data);
        }
      } catch (err) {
        console.error("無法同步雲端歷史資料", err);
      }
    }

    function renderList() {
      const records = getLocalRecords().sort((a,b) => new Date(b.time) - new Date(a.time));
      const container = document.getElementById('historyList');

      if (records.length === 0) {
        container.innerHTML = '<div style="color:#888; text-align:center; padding:16px;">尚無紀錄</div>';
        return;
      }

      container.innerHTML = records.map(r => `
        <div class="history-item">
          <div>
            <span class="tag">${r.type}</span>
            <span class="time">${r.time.replace('T', ' ')}</span>
          </div>
          <div>
            <span class="amount">${r.actual} ml</span>
            <button class="btn-del" onclick="deleteRecord('${r.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteRecord(id) {
      if (!confirm("確定要刪除這筆紀錄嗎？")) return;

      let records = getLocalRecords().filter(r => r.id !== id);
      saveLocalRecords(records);

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'DELETE', id })
      }).catch(err => console.error("雲端刪除失敗", err));
    }
  </script>
</body>
</html>
