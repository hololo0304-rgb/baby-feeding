<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>寶寶餵奶紀錄</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 20px auto;
    padding: 15px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:10px;
}

input,select,button{
    width:100%;
    padding:10px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#45a049;
}

.record{
    border-bottom:1px solid #eee;
    padding:10px 0;
}

.record:last-child{
    border-bottom:none;
}

.small{
    color:#666;
    font-size:13px;
}
</style>
</head>

<body>

<h1>🍼 寶寶餵奶紀錄</h1>

<div class="card">

    <label>餵奶時間</label>
    <input type="datetime-local" id="feedTime">

    <label>餵奶方式</label>
    <select id="feedType">
        <option value="配方奶">配方奶</option>
        <option value="瓶餵母奶">瓶餵母奶</option>
        <option value="親餵">親餵</option>
    </select>

    <label>準備量 (ml)</label>
    <input type="number" id="preparedAmount" min="0">

    <label>剩餘量 (ml)</label>
    <input type="number" id="remainingAmount" min="0">

    <button id="saveBtn">
        紀錄這餐
    </button>

</div>

<div class="card">
    <h2>歷史紀錄</h2>
    <div id="recordsContainer">
        載入中...
    </div>
</div>

<!-- 請務必保持此順序 -->
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
