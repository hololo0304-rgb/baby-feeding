<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嬰兒餵奶紀錄</title>
<style>
:root {
  --bg-color: #FFF9F5;
  --card-bg: #FFFFFF;
  --primary-pink: #FFB7B2;
  --primary-pink-hover: #FF9E99;
  --soft-green: #E2F0CB;
  --soft-green-hover: #D4E7B5;
  --soft-purple: #E0C3FC;
  --text-main: #4A4A4A;
  --text-sub: #7D7D7D;
  --border-color: #FFE5D9;
  --danger-color: #FF8B94;
  --shadow: 0 4px 15px rgba(255, 183, 178, 0.15);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
.app-container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

header { text-align: center; padding: 6px 0; }
header h1 { font-size: 1.4rem; color: #5C6B73; font-weight: 700; }

.card { background: var(--card-bg); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }

/* 頂部統計卡片 */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.stat-box { background: #FFF5F2; padding: 8px 12px; border-radius: 12px; text-align: center; font-size: 0.85rem; color: var(--text-sub); }
.stat-box b { font-size: 1.05rem; color: #D8707C; margin-left: 4px; }

/* 頁面切換控制 (C區需求) */
.view-page { display: none; }
.view-page.active { display: flex; flex-direction: column; gap: 12px; }

/* A 區：時間欄位（精簡至分，無秒數） */
.time-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.time-display { font-size: 0.95rem; font-weight: bold; color: #3182CE; }
.btn-plus5 { background: var(--soft-green); color: #4A6B22; border: none; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

/* 餵奶方式切換 */
.section-label { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
.type-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.type-btn { height: 40px; border: 1.5px solid var(--border-color); background: #FFF; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--text-main); cursor: pointer; }
.type-btn.active { background-color: var(--primary-pink); color: white; border-color: var(--primary-pink); }

/* 奶量按鈕 */
.amount-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.amount-btn { height: 36px; border: 1.5px solid var(--border-color); background: #FFF; border-radius: 8px; font-size: 0.85rem; font-weight: bold; color: var(--text-main); cursor: pointer; }
.amount-btn.active { background-color: #FFE5D9; border-color: var(--primary-pink); color: #D8707C; }

.custom-input { width: 100%; height: 38px; border: 1.5px solid var(--border-color); border-radius: 8px; padding: 0 10px; font-size: 0.85rem; outline: none; margin-bottom: 10px; background: #FAF9F6; }

.btn-submit { width: 100%; height: 46px; background-color: var(--primary-pink); color: white; border: none; border-radius: 23px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(255, 183, 178, 0.4); display: flex; align-items: center; justify-content: center; gap: 6px; }

/* B 區：整區高度壓縮成橫向單行 */
.compact-b-zone { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #FAF9F6; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-color); }
.b-info { font-size: 0.8rem; color: var(--text-sub); line-height: 1.2; flex-shrink: 0; }
.b-info b { color: var(--text-main); }
.b-input { width: 70px; height: 32px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; font-size: 0.85rem; outline: none; }
.btn-update-left { background: var(--soft-green); color: #4A6B22; border: none; height: 32px; padding: 0 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; white-shrink: 0; }

/* C 區：歷史紀錄按鈕與標頭 */
.nav-bar { display: flex; justify-content: space-between; align-items: center; }
.btn-history-link { background: #EBF8FF; color: #2B6CB0; border: 1px solid #BEE3F8; height: 34px; padding: 0 12px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; cursor: pointer; }

/* D 區：最近 12 小時紀錄與刪除按鈕 */
.record-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.record-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #FAF9F6; border-radius: 8px; border-left: 4px solid var(--primary-pink); font-size: 0.82rem; }
.record-text { color: var(--text-main); }
.record-text b { color: #D8707C; }
.btn-delete { background: #FFE3E3; color: var(--danger-color); border: none; padding: 3px 8px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">
  <header><h1>🍼 寶寶餵奶紀錄</h1></header>

  <!-- ================= 主頁面 (Main View) ================= -->
  <div id="mainView" class="view-page active">
    
    <!-- 頂部統計欄 -->
    <div class="stat-grid">
      <div class="stat-box">距上一餐：<b id="timeDiff">18h 12m</b></div>
      <div class="stat-box">上一餐：<b id="lastAmount">90ml</b></div>
    </div>

    <!-- 主記錄區塊 -->
    <div class="card">
      <!-- A 區：精簡時間 (無秒數) + E (+5分鐘按鈕) -->
      <div class="time-bar">
        <span class="time-display" id="currentTimeDisplay">2026/10/01 09:55</span>
        <button class="btn-plus5" onclick="addMinutes(5)">+5分鐘</button>
      </div>

      <div class="section-label">餵奶方式</div>
      <div class="type-selector">
        <button class="type-btn active" onclick="selectType(this, '配方奶')">配方奶</button>
        <button class="type-btn" onclick="selectType(this, '母奶')">母奶</button>
        <button class="type-btn" onclick="selectType(this, '親餵')">親餵</button>
      </div>

      <div class="section-label">奶量 ( ml )</div>
      <div class="amount-selector">
        <button class="amount-btn" onclick="selectAmount(90)">90</button>
        <button class="amount-btn" onclick="selectAmount(120)">120</button>
        <button class="amount-btn" onclick="selectAmount(150)">150</button>
        <button class="amount-btn" onclick="selectAmount(180)">180</button>
      </div>
      <input type="number" id="customAmountInput" class="custom-input" placeholder="自訂奶量" />

      <button class="btn-submit" onclick="submitFeeding()">✨ 開始餵奶</button>
    </div>

    <!-- B 區：補填上一餐剩餘量 (高度壓縮成一行) -->
    <div class="card" style="padding: 10px;">
      <div class="compact-b-zone">
        <div class="b-info">
          <span>上一餐: <b id="bMealType">配方奶</b> | 準備 <b id="bPrep">90</b>ml</span><br>
          <span style="font-size:0.75rem;">已填剩餘: <b id="bLeft">0</b>ml</span>
        </div>
        <input type="number" id="bLeftInput" class="b-input" placeholder="剩餘ml" />
        <button class="btn-update-left" onclick="updateLeftAmount()">填剩餘量</button>
      </div>
    </div>

    <!-- D 區：最近 12 小時紀錄 (含右側 C/D 按鈕區) -->
    <div class="card">
      <div class="nav-bar">
        <span class="section-label" style="margin-bottom:0;">最近 12 小時紀錄</span>
        <!-- C 區：切換至歷史頁面按鈕 -->
        <button class="btn-history-link" onclick="switchPage('historyView')">完整歷史紀錄 ➔</button>
      </div>
      
      <div id="recent12hList" class="record-list">
        <!-- 動態渲染 12 小時內紀錄 -->
      </div>
    </div>

  </div>

  <!-- ================= C 區：新生成的歷史紀錄頁面 (History View) ================= -->
  <div id="historyView" class="view-page">
    <div class="card">
      <div class="nav-bar" style="margin-bottom: 10px;">
        <button class="btn-history-link" onclick="switchPage('mainView')">← 返回主頁</button>
        <span style="font-weight: bold; color: #5C6B73;">歷史紀錄清單</span>
      </div>
      <div id="fullHistoryList" class="record-list">
        <!-- 動態渲染所有歷史紀錄 -->
      </div>
    </div>
  </div>

</div>

<script>
  let currentSelectedType = '配方奶';
  let currentSelectedAmount = 90;
  let currentSelectedTime = new Date();

  let globalRecords = [];

  // A 區：初始化與更新時間（精簡至分，移除秒數）
  function updateTimeDisplay() {
    const y = currentSelectedTime.getFullYear();
    const m = currentSelectedTime.getMonth() + 1;
    const d = currentSelectedTime.getDate();
    const hh = String(currentSelectedTime.getHours()).padStart(2, '0');
    const mm = String(currentSelectedTime.getMinutes()).padStart(2, '0');
    document.getElementById('currentTimeDisplay').innerText = `${y}/${m}/${d} ${hh}:${mm}`;
  }

  // E 區：+5分鐘
  function addMinutes(mins) {
    currentSelectedTime = new Date(currentSelectedTime.getTime() + mins * 60000);
    updateTimeDisplay();
  }

  function selectType(btn, type) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSelectedType = type;
  }

  function selectAmount(amt) {
    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    currentSelectedAmount = amt;
    document.getElementById('customAmountInput').value = '';
  }

  // C 區：頁面切換 (主頁 ↔ 歷史頁，含返回鍵)
  function switchPage(pageId) {
    document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (pageId === 'historyView') renderFullHistory();
  }

  // 讀取紀錄
  function fetchRecords() {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(data => {
        globalRecords = data;
        renderAll();
      }).getRecords();
    } else {
      // 模擬測試資料
      globalRecords = [
        { id: "1", time: "2026/10/1 09:55", type: "配方奶", prep: 90, left: 30, actual: 60 },
        { id: "2", time: "2026/10/1 05:30", type: "配方奶", prep: 120, left: 10, actual: 110 },
        { id: "3", time: "2026/9/30 15:43", type: "配方奶", prep: 90, left: 0, actual: 90 }
      ];
      renderAll();
    }
  }

  // 開始餵奶新增
  function submitFeeding() {
    const customAmt = Number(document.getElementById('customAmountInput').value);
    const finalPrep = customAmt > 0 ? customAmt : currentSelectedAmount;
    
    const timeStr = document.getElementById('currentTimeDisplay').innerText;
    const recordData = { time: timeStr, type: currentSelectedType, prep: finalPrep, left: 0, actual: finalPrep };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(() => fetchRecords()).addRecord(recordData);
    } else {
      globalRecords.unshift({ id: Date.now().toString(), ...recordData });
      renderAll();
    }
  }

  // B 區：更新上一餐剩餘量
  function updateLeftAmount() {
    const leftVal = Number(document.getElementById('bLeftInput').value) || 0;
    if (globalRecords.length === 0) return alert('無上一餐紀錄可補填');

    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(() => fetchRecords()).updateLastLeftAmount(leftVal);
    } else {
      globalRecords[0].left = leftVal;
      globalRecords[0].actual = Math.max(0, globalRecords[0].prep - leftVal);
      renderAll();
    }
    document.getElementById('bLeftInput').value = '';
  }

  // D 區：刪除紀錄
  function deleteRecord(id) {
    if (!confirm('確定刪除此筆紀錄？')) return;
    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(() => fetchRecords()).deleteRecordById(id);
    } else {
      globalRecords = globalRecords.filter(r => r.id !== id);
      renderAll();
    }
  }

  // 渲染畫面
  function renderAll() {
    if (globalRecords.length > 0) {
      const last = globalRecords[0];
      document.getElementById('bMealType').innerText = last.type;
      document.getElementById('bPrep').innerText = last.prep;
      document.getElementById('bLeft').innerText = last.left;
      document.getElementById('lastAmount').innerText = `${last.actual}ml`;
    }
    renderRecent12h();
  }

  // D 區：渲染最近 12 小時紀錄 (帶刪除按鈕、準備/剩餘/實際格式)
  function renderRecent12h() {
    const list = document.getElementById('recent12hList');
    const now = new Date().getTime();
    const twelveHours = 12 * 60 * 60 * 1000;

    const recent = globalRecords.filter(r => {
      const recTime = new Date(r.time.replace(/-/g, '/')).getTime();
      return (now - recTime) <= twelveHours;
    });

    if (recent.length === 0) {
      list.innerHTML = '<div style="color:#aaa; text-align:center; font-size:0.8rem; padding:8px;">近 12 小時內無紀錄</div>';
      return;
    }

    list.innerHTML = recent.map(r => {
      const timeOnly = r.time.split(' ')[1] || r.time;
      return `
        <div class="record-item">
          <div class="record-text">
            <b>${timeOnly}</b> | ${r.type} | 準備${r.prep}ml 剩餘${r.left}ml <b>實際${r.actual}ml</b>
          </div>
          <button class="btn-delete" onclick="deleteRecord('${r.id}')">刪除</button>
        </div>
      `;
    }).join('');
  }

  // C 區：渲染完整歷史紀錄頁面
  function renderFullHistory() {
    const list = document.getElementById('fullHistoryList');
    if (globalRecords.length === 0) {
      list.innerHTML = '<div style="color:#aaa; text-align:center; font-size:0.8rem;">無歷史紀錄</div>';
      return;
    }

    list.innerHTML = globalRecords.map(r => `
      <div class="record-item">
        <div class="record-text">
          <b>${r.time}</b> | ${r.type} | 準備${r.prep}ml 剩餘${r.left}ml <b>實際${r.actual}ml</b>
        </div>
      </div>
    `).join('');
  }

  // 初始化執行
  updateTimeDisplay();
  fetchRecords();
</script>
</body>
</html>
