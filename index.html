<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>餵奶紀錄小工具</title>
  <style>
    :root {
      --bg-color: #FFF9F5;
      --card-bg: #FFFFFF;
      --primary-pink: #FFB7B2;
      --primary-pink-hover: #FF9E99;
      --text-main: #4A4A4A;
      --text-sub: #7D7D7D;
      --border-color: #FFE5D9;
      --danger-color: #FF6B6B;
      --shadow: 0 4px 15px rgba(255, 183, 178, 0.15);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; min-height: 100vh; }
    
    .app-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }

    /* 頁面切換機制 (C) */
    .view-page { display: none; }
    .view-page.active { display: flex; flex-direction: column; gap: 12px; }

    .page-header { display: flex; justify-content: space-between; align-items: center; }
    .page-header h2 { font-size: 1.1rem; color: #5C6B73; }

    /* B 區：整區單行壓縮 Flexbox */
    .compact-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 2px;
    }
    
    /* 調整輸入欄位大小 */
    .compact-row input[type="datetime-local"] { width: 155px; height: 38px; font-size: 0.85rem; padding: 0 6px; border: 1px solid var(--border-color); border-radius: 8px; }
    .compact-row input[type="number"] { width: 68px; height: 38px; font-size: 0.85rem; text-align: center; border: 1px solid var(--border-color); border-radius: 8px; }
    
    .btn { height: 38px; padding: 0 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .btn-main { background-color: var(--primary-pink); color: white; }
    .btn-sub { background-color: #FFF0E6; color: #D8707C; border: 1px solid var(--border-color); }
    .btn-nav { background-color: #E2F0CB; color: #556B2F; }
    .btn-del { background-color: var(--danger-color); color: white; height: 28px; padding: 0 8px; font-size: 0.75rem; border-radius: 6px; }

    /* D 區：最近 12 小時記錄 */
    .record-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #FAF9F6;
      border-radius: 8px;
      border-left: 4px solid var(--primary-pink);
      font-size: 0.88rem;
    }
    .record-time { font-weight: bold; color: #666; font-size: 0.82rem; }
    .record-detail { color: var(--text-main); }
    .loading-text { text-align: center; color: var(--text-sub); font-size: 0.85rem; padding: 10px 0; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ================= 主頁面 (Main View) ================= -->
  <div id="mainView" class="view-page active">
    
    <div class="page-header">
      <h2>嬰兒餵奶快速登記</h2>
      <!-- C 區：前往歷史紀錄頁面 -->
      <button class="btn btn-nav" onclick="switchPage('historyView')">歷史紀錄 ➔</button>
    </div>

    <!-- B 區：整區壓縮成單一行 (時間、準備、剩餘、記錄按鈕、補填按鈕) -->
    <div class="card">
      <div class="compact-row">
        <!-- A 區： datetime-local 搭配 step=60 隱藏秒數 -->
        <input type="datetime-local" id="inputTime" step="60" />
        <input type="number" id="prepAmount" placeholder="準備ml" />
        <input type="number" id="leftAmount" placeholder="剩餘ml" />
        <button class="btn btn-main" onclick="addFeedingRecord()">記錄</button>
        <button class="btn btn-sub" onclick="fillPreviousLeft()">補填上一餐剩餘</button>
      </div>
    </div>

    <!-- D 區：最近 12 小時記錄 -->
    <div class="card">
      <div class="page-header">
        <h3 style="font-size:0.95rem; color:#666;">最近 12 小時記錄</h3>
      </div>
      <div id="recent12hList" class="record-list">
        <div class="loading-text">資料載入中...</div>
      </div>
    </div>

  </div>

  <!-- ================= C 區：歷史紀錄頁面 (History View) ================= -->
  <div id="historyView" class="view-page">
    <div class="page-header">
      <!-- C 區：返回按鈕 -->
      <button class="btn btn-nav" onclick="switchPage('mainView')">← 返回主頁</button>
      <h2>完整歷史紀錄</h2>
    </div>

    <div class="card">
      <div id="fullHistoryList" class="record-list">
        <div class="loading-text">資料載入中...</div>
      </div>
    </div>
  </div>

</div>

<script>
  let globalRecords = [];

  // 初始化時間 (A 區：去掉秒數，只保留 YYYY-MM-DDTHH:mm)
  function initTimeInput() {
    const now = new Date();
    now.setSeconds(0, 0);
    const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById('inputTime').value = localIso;
  }

  // 格式化時間 (A 區：時間不顯示秒數)
  function formatTimeNoSeconds(timeStr) {
    if (!timeStr) return '';
    // 將 "2026-10-01 08:30:00" 轉為 "2026-10-01 08:30" 或僅顯示時間 "08:30"
    const parts = timeStr.replace('T', ' ').split(' ');
    if (parts.length >= 2) {
      const timePart = parts[1].substring(0, 5); // 取 HH:mm
      return `${parts[0]} ${timePart}`;
    }
    return timeStr.substring(0, 16);
  }

  // 頁面切換 (C 區)
  function switchPage(pageId) {
    document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (pageId === 'historyView') renderFullHistory();
  }

  // 從 Apps Script 讀取資料
  function fetchRecords() {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(data => {
        globalRecords = data;
        renderRecent12h();
      }).getRecords();
    } else {
      // 本地測試模擬資料
      globalRecords = [
        { id: "1", time: "2026-10-01 08:30", prep: 90, left: 30, actual: 60 },
        { id: "2", time: "2026-10-01 02:15", prep: 120, left: 10, actual: 110 },
        { id: "3", time: "2026-09-30 20:00", prep: 150, left: 0, actual: 150 }
      ];
      renderRecent12h();
    }
  }

  // 新增紀錄 (B 區連動)
  function addFeedingRecord() {
    const rawTime = document.getElementById('inputTime').value;
    const prep = Number(document.getElementById('prepAmount').value) || 0;
    const left = Number(document.getElementById('leftAmount').value) || 0;
    
    if (!rawTime) return alert('請選擇時間！');
    if (prep <= 0) return alert('請輸入準備奶量！');

    const formattedTime = rawTime.replace('T', ' '); // 去掉 T
    const actual = Math.max(0, prep - left);

    const recordData = { time: formattedTime, prep: prep, left: left, actual: actual, type: '配方奶' };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(() => {
        document.getElementById('prepAmount').value = '';
        document.getElementById('leftAmount').value = '';
        fetchRecords();
      }).addRecord(recordData);
    } else {
      globalRecords.unshift({ id: Date.now().toString(), ...recordData });
      renderRecent12h();
    }
  }

  // B 區：補填上一餐剩餘量
  function fillPreviousLeft() {
    if (globalRecords.length === 0) return alert('目前尚無紀錄！');
    const last = globalRecords[0];
    const left = prompt(`補填上一餐 (${formatTimeNoSeconds(last.time)}) 的剩餘量 (ml)：`, last.left);

    if (left !== null && !isNaN(left)) {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(() => fetchRecords()).updateLastLeftAmount(Number(left));
      } else {
        last.left = Number(left);
        last.actual = Math.max(0, last.prep - last.left);
        renderRecent12h();
      }
    }
  }

  // D 區：刪除紀錄
  function deleteRecord(id) {
    if (!confirm('確定要刪除這筆紀錄嗎？')) return;

    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(() => fetchRecords()).deleteRecordById(id);
    } else {
      globalRecords = globalRecords.filter(r => r.id !== id);
      renderRecent12h();
    }
  }

  // D 區：渲染最近 12 小時紀錄 (格式：準備90ml 剩餘30ml 實際60ml，並含刪除按鈕)
  function renderRecent12h() {
    const list = document.getElementById('recent12hList');
    const now = new Date().getTime();
    const twelveHours = 12 * 60 * 60 * 1000;

    const recent = globalRecords.filter(r => {
      const recordTime = new Date(r.time.replace(/-/g, '/')).getTime();
      return (now - recordTime) <= twelveHours;
    });

    if (recent.length === 0) {
      list.innerHTML = '<div class="loading-text">近 12 小時內無紀錄</div>';
      return;
    }

    list.innerHTML = recent.map(r => `
      <div class="record-item">
        <div>
          <span class="record-time">${formatTimeNoSeconds(r.time).split(' ')[1] || formatTimeNoSeconds(r.time)}</span>
          <span class="record-detail">準備${r.prep}ml 剩餘${r.left}ml <b>實際${r.actual}ml</b></span>
        </div>
        <button class="btn-del" onclick="deleteRecord('${r.id}')">刪除</button>
      </div>
    `).join('');
  }

  // C 區：渲染完整歷史紀錄 (只看歷史，不重疊刪除按鈕，乾淨排版)
  function renderFullHistory() {
    const list = document.getElementById('fullHistoryList');
    if (globalRecords.length === 0) {
      list.innerHTML = '<div class="loading-text">無歷史紀錄</div>';
      return;
    }

    list.innerHTML = globalRecords.map(r => `
      <div class="record-item">
        <div>
          <span class="record-time">${formatTimeNoSeconds(r.time)}</span>
          <span class="record-detail">準備${r.prep}ml | 剩餘${r.left}ml | <b>實際${r.actual}ml</b></span>
        </div>
      </div>
    `).join('');
  }

  // 初始化
  initTimeInput();
  fetchRecords();
</script>

</body>
</html>
