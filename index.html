<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>寶寶餵奶紀錄</title>
  <style>
    :root {
      --bg-color: #FFF8F5;
      --card-bg: #FFFFFF;
      --primary-pink: #FFB3BA;
      --primary-pink-active: #FF808C;
      --pink-border: #FFE0E3;
      --btn-green: #E2F0CB;
      --btn-blue: #E1F5FE;
      --btn-yellow: #F0F4C3;
      --text-main: #4A4A4A;
      --text-sub: #7D7D7D;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 12px rgba(255, 179, 186, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 主要卡片樣式 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--pink-border);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    /* 時間區塊 */
    .time-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .time-display-box {
      flex: 1;
      height: 48px;
      background: #FFFDFD;
      border: 2px solid var(--pink-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: #0288D1;
      position: relative;
    }

    .time-picker-hidden {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .btn-add-time {
      width: 80px;
      height: 48px;
      background-color: var(--btn-green);
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: bold;
      color: #556B2F;
      cursor: pointer;
    }

    /* 餵奶方式選擇 */
    .type-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .type-btn {
      height: 46px;
      border: 2px solid var(--pink-border);
      background: #FFF;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: bold;
      color: #0288D1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .type-btn.active {
      background-color: var(--primary-pink);
      color: #FFF;
      border-color: var(--primary-pink);
    }

    /* 快捷奶量按鈕 */
    .preset-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .preset-btn {
      height: 42px;
      border: 2px solid var(--pink-border);
      background-color: #FFF;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: bold;
      color: #0288D1;
      cursor: pointer;
    }

    .input-amount {
      width: 100%;
      height: 48px;
      border: 2px solid var(--pink-border);
      border-radius: var(--radius-md);
      padding: 0 14px;
      font-size: 0.95rem;
      outline: none;
      background-color: #FFFDFD;
    }

    .input-amount::placeholder {
      color: #BBB;
    }

    /* 紀錄提交主按鈕 */
    .btn-submit {
      width: 100%;
      height: 52px;
      background-color: var(--primary-pink);
      color: white;
      border: none;
      border-radius: 26px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 179, 186, 0.4);
      margin-top: 6px;
    }

    .btn-submit:active {
      background-color: var(--primary-pink-active);
    }

    /* 功能導覽按鈕區 */
    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--pink-border);
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
    }

    .btn-action.history {
      background-color: var(--btn-yellow);
      border-color: #DCE775;
      color: #33691E;
    }

    .btn-action.modify {
      background-color: var(--btn-blue);
      border-color: #81D4FA;
      color: #0277BD;
    }

    /* 紀錄列表區塊 */
    .list-header {
      font-size: 1.05rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background-color: #FFFDFB;
      border-radius: var(--radius-md);
      border-left: 4px solid var(--primary-pink);
    }

    .record-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .record-type {
      font-size: 0.95rem;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .record-sub {
      font-size: 0.82rem;
      color: #888;
    }

    .record-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-amount-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: #E57373;
    }

    .btn-delete {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.5;
      padding: 2px;
    }

    .btn-delete:active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="card">
      <form id="feed-form">
        <!-- ⏰ 餵奶時間 -->
        <div class="form-group">
          <div class="form-label">⏰ 餵奶時間</div>
          <div class="time-container">
            <div class="time-display-box" id="time-text">
              2026年9月29日 14:43
              <input type="datetime-local" id="feed-time" class="time-picker-hidden" onchange="updateTimeDisplay()">
            </div>
            <button type="button" class="btn-add-time" onclick="addMinutes(5)">+5分鐘</button>
          </div>
        </div>

        <!-- 🍼 餵奶方式 -->
        <div class="form-group">
          <div class="form-label">🍼 餵奶方式</div>
          <div class="type-selector">
            <button type="button" class="type-btn active" data-type="配方奶">配方奶</button>
            <button type="button" class="type-btn" data-type="瓶餵母奶">瓶餵母奶</button>
            <button type="button" class="type-btn" data-type="親餵">親餵</button>
          </div>
        </div>

        <!-- 🥛 準備/泡奶量 (ml) -->
        <div class="form-group" id="amount-group">
          <div class="form-label">🥛 準備/泡奶量 (ml)</div>
          <div class="preset-container">
            <button type="button" class="preset-btn" onclick="setAmount(60)">60</button>
            <button type="button" class="preset-btn" onclick="setAmount(90)">90</button>
            <button type="button" class="preset-btn" onclick="setAmount(120)">120</button>
            <button type="button" class="preset-btn" onclick="setAmount(150)">150</button>
          </div>
          <input type="number" id="feed-amount" class="input-amount" placeholder="輸入奶量 ml" inputmode="numeric">
        </div>

        <button type="submit" class="btn-submit">✨ 紀錄這餐</button>
      </form>
    </div>

    <!-- 按鈕選擇區 -->
    <div class="action-group">
      <a href="history.html" class="btn-action history">📜 歷史紀錄</a>
      <button type="button" class="btn-action modify" onclick="modifyLastRest()">✏️ 補填/修改前次剩餘量</button>
    </div>

    <!-- 📜 最近 12 小時紀錄 -->
    <div class="card">
      <div class="list-header">📜 最近 12 小時紀錄</div>
      <div id="record-list" class="record-list">
        <!-- 動態渲染紀錄列表 -->
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw8dPU0GDoC5_GEM1VFeYNQXGtXtAHNrzyph_W-kqFlpcEFRZ2qf77DyidRfrAxkwjQXA/exec';

    let currentType = '配方奶';
    let records = [];
    let selectedDateObj = new Date();

    window.onload = function() {
      addMinutes(0); // 初始化時間顯示
      setupTypeSelector();
      fetchRecords();
    };

    function setupTypeSelector() {
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentType = this.getAttribute('data-type');
          
          const amountGroup = document.getElementById('amount-group');
          if (currentType === '親餵') {
            amountGroup.style.display = 'none';
          } else {
            amountGroup.style.display = 'block';
          }
        });
      });
    }

    function addMinutes(mins) {
      selectedDateObj.setMinutes(selectedDateObj.getMinutes() + mins);
      
      const year = selectedDateObj.getFullYear();
      const month = selectedDateObj.getMonth() + 1;
      const day = selectedDateObj.getDate();
      const hours = String(selectedDateObj.getHours()).padStart(2, '0');
      const minutes = String(selectedDateObj.getMinutes()).padStart(2, '0');

      document.getElementById('time-text').childNodes[0].nodeValue = `${year}年${month}月${day}日 ${hours}:${minutes} `;

      const isoMonth = String(month).padStart(2, '0');
      const isoDay = String(day).padStart(2, '0');
      document.getElementById('feed-time').value = `${year}-${isoMonth}-${isoDay}T${hours}:${minutes}`;
    }

    function updateTimeDisplay() {
      const val = document.getElementById('feed-time').value;
      if (val) {
        selectedDateObj = new Date(val);
        addMinutes(0);
      }
    }

    function setAmount(val) {
      document.getElementById('feed-amount').value = val;
    }

    function fetchRecords() {
      if (!GAS_URL) {
        loadLocalRecords();
        return;
      }
      fetch(GAS_URL, { redirect: 'follow' })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success' && data.records) {
            records = data.records;
            localStorage.setItem('baby_feed_records', JSON.stringify(records));
            renderList();
          } else {
            loadLocalRecords();
          }
        })
        .catch(() => loadLocalRecords());
    }

    function loadLocalRecords() {
      const local = localStorage.getItem('baby_feed_records');
      if (local) {
        try { records = JSON.parse(local); } catch(e) { records = []; }
      }
      renderList();
    }

    // 儲存這餐
    document.getElementById('feed-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const year = selectedDateObj.getFullYear();
      const month = String(selectedDateObj.getMonth() + 1).padStart(2, '0');
      const day = String(selectedDateObj.getDate()).padStart(2, '0');
      const hours = String(selectedDateObj.getHours()).padStart(2, '0');
      const minutes = String(selectedDateObj.getMinutes()).padStart(2, '0');
      const timeStr = `${year}-${month}-${day} ${hours}:${minutes}`;

      let prepAmt = 0;
      if (currentType !== '親餵') {
        prepAmt = parseInt(document.getElementById('feed-amount').value, 10);
        if (isNaN(prepAmt)) {
          alert('請輸入奶量 ml');
          return;
        }
      }

      const newRec = {
        id: String(Date.now()),
        timeStr: timeStr,
        type: currentType,
        prepAmount: prepAmt,
        restAmount: 0,
        actualAmount: prepAmt
      };

      records.unshift(newRec);
      localStorage.setItem('baby_feed_records', JSON.stringify(records));
      renderList();

      if (GAS_URL) {
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', record: newRec })
        });
      }

      document.getElementById('feed-amount').value = '';
      alert('已成功紀錄！');
    });

    function modifyLastRest() {
      if (records.length === 0) {
        alert('尚無紀錄可修改！');
        return;
      }
      const last = records[0];
      const val = prompt(`請輸入上一餐 (${last.type}) 的剩餘奶量 (ml)：`, last.restAmount || 0);
      if (val !== null) {
        const rest = parseInt(val, 10) || 0;
        last.restAmount = rest;
        last.actualAmount = Math.max(0, (last.prepAmount || 0) - rest);

        localStorage.setItem('baby_feed_records', JSON.stringify(records));
        renderList();

        if (GAS_URL) {
          fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'add', record: last })
          });
        }
      }
    }

    function deleteRecord(id) {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;
      records = records.filter(r => String(r.id) !== String(id));
      localStorage.setItem('baby_feed_records', JSON.stringify(records));
      renderList();

      if (GAS_URL) {
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
      }
    }

    function renderList() {
      const listEl = document.getElementById('record-list');
      listEl.innerHTML = '';

      if (records.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#AAA; padding: 12px;">暫無紀錄</div>';
        return;
      }

      // 渲染最近 12 小時
      const twelveHoursAgo = Date.now() - (12 * 60 * 60 * 1000);
      const recent = records.filter(r => {
        const t = new Date(r.timeStr.replace(/-/g, '/')).getTime();
        return t >= twelveHoursAgo || isNaN(t);
      });

      recent.forEach(r => {
        const item = document.createElement('div');
        item.className = 'record-item';

        const prep = r.prepAmount !== undefined ? r.prepAmount : (r.amount || 0);
        const rest = r.restAmount !== undefined ? r.restAmount : 0;
        const actual = r.actualAmount !== undefined ? r.actualAmount : prep;

        // 右側數字 (若有剩餘顯示計算後的剩餘或實際，對齊原截圖)
        const displayRight = r.type === '親餵' ? '親餵' : `${rest} ml`;

        item.innerHTML = `
          <div class="record-left">
            <div class="record-type">⏰ ${r.type}</div>
            <div class="record-sub">${prep}</div>
          </div>
          <div class="record-right">
            <div class="record-amount-val">${displayRight}</div>
            <button class="btn-delete" onclick="deleteRecord('${r.id}')">🗑️</button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }
  </script>
</body>
</html>
