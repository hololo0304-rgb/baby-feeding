<!-- 餵奶時間 -->
<div class="mb-5">
  <label class="font-bold flex items-center gap-1 text-gray-700 mb-2">
    ⏰ 餵奶時間
  </label>
  <div class="flex gap-2">
    <input type="datetime-local" id="timeInput" class="flex-1 border border-pink-200 bg-pink-50/30 rounded-2xl p-3 text-blue-500 font-semibold focus:outline-none focus:ring-2 focus:ring-pink-300">
    <button type="button" onclick="addMinutes(5)" class="bg-emerald-100 text-emerald-800 px-4 rounded-2xl font-semibold text-sm hover:bg-emerald-200 active:scale-95 transition">
      +5分鐘
    </button>
  </div>
</div>

<!-- 餵奶方式 -->
<div class="mb-5">
  <label class="font-bold flex items-center gap-1 text-gray-700 mb-2">
    🍼 餵奶方式
  </label>
  <div class="grid grid-cols-3 gap-2">
    <button type="button" class="btn-type active border border-pink-200 py-3 rounded-2xl font-bold text-gray-600 bg-white" onclick="setType(this, '配方奶')">配方奶</button>
    <button type="button" class="btn-type border border-pink-200 py-3 rounded-2xl font-bold text-gray-600 bg-white" onclick="setType(this, '瓶餵母奶')">瓶餵母奶</button>
    <button type="button" class="btn-type border border-pink-200 py-3 rounded-2xl font-bold text-gray-600 bg-white" onclick="setType(this, '親餵')">親餵</button>
  </div>
</div>

<!-- 準備/泡奶量 -->
<div class="mb-5">
  <label class="font-bold flex items-center gap-1 text-gray-700 mb-2">
    🥛 準備/泡奶量 (ml)
  </label>
  <div class="grid grid-cols-4 gap-2 mb-2">
    <button type="button" class="btn-amount border border-pink-200 py-2 rounded-xl text-blue-500 font-bold text-sm bg-white" onclick="setPrepAmount(this, 60)">60</button>
    <button type="button" class="btn-amount border border-pink-200 py-2 rounded-xl text-blue-500 font-bold text-sm bg-white" onclick="setPrepAmount(this, 90)">90</button>
    <button type="button" class="btn-amount border border-pink-200 py-2 rounded-xl text-blue-500 font-bold text-sm bg-white" onclick="setPrepAmount(this, 120)">120</button>
    <button type="button" class="btn-amount border border-pink-200 py-2 rounded-xl text-blue-500 font-bold text-sm bg-white" onclick="setPrepAmount(this, 150)">150</button>
  </div>
  <input type="number" id="prepInput" placeholder="輸入奶量 ml" class="w-full border border-pink-200 bg-pink-50/20 rounded-2xl p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-300">
</div>

<!-- 剩餘奶量 -->
<div class="mb-6">
  <label class="font-bold flex items-center gap-1 text-gray-700 mb-2">
    🥣 剩餘奶量 (ml) <span class="text-xs text-gray-400 font-normal">(沒剩下請填 0)</span>
  </label>
  <input type="number" id="restInput" value="0" placeholder="0" class="w-full border border-pink-200 bg-pink-50/20 rounded-2xl p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-300">
</div>

<!-- 提交按鈕 -->
<button type="button" onclick="saveRecord()" id="submitBtn" class="w-full bg-pink-300 hover:bg-pink-400 active:scale-98 text-white font-bold py-4 rounded-2xl shadow-sm text-lg transition flex items-center justify-center gap-2">
  ✨ 記錄這餐
</button>
