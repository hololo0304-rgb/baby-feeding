<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>寶寶餵奶紀錄</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:8px;
    background:#FFF8F7;
    font-family:"Microsoft JhengHei",sans-serif;
    color:#444;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#D97986;
    font-size:22px;
    margin:6px 0 10px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:10px;
    margin-bottom:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.summary-row{
    display:flex;
    gap:8px;
}

.summary-item{
    flex:1;
    background:#FDEEEA;
    border-radius:10px;
    padding:8px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}

.summary-item span{
    color:#D97986;
    font-size:18px;
}

.time-row{
    display:flex;
    align-items:center;
    gap:8px;
}

#displayTime{
    flex:1;
    font-size:15px;
    font-weight:bold;
    color:#1976D2;
}

.small-btn{
    border:none;
    background:#DDE8B3;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
}

.section-title{
    margin:10px 0 6px;
    font-size:14px;
    font-weight:bold;
}

.type-row{
    display:flex;
    gap:6px;
}

.type-btn{

    flex:1;

    border:2px solid #F5B4B0;
    background:white;

    padding:8px;

    border-radius:10px;

    cursor:pointer;

    font-size:13px;
}

.type-btn.active{
    background:#F5B4B0;
    color:white;
}

.milk-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.milk-btn{

    border:2px solid #F5B4B0;
    background:white;

    padding:8px 0;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;
    font-weight:bold;
}

.milk-btn.active{
    background:#FDEEEA;
}

.remain-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.remain-btn{

    border:2px solid #DDE8B3;
    background:white;

    padding:8px 0;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;
    font-weight:bold;
}

.remain-btn.active{
    background:#DDE8B3;
}

input{

    width:100%;

    padding:10px;

    margin-top:8px;

    border:1px solid #ddd;
    border-radius:10px;

    font-size:14px;
}

.save-btn{

    width:100%;

    margin-top:8px;

    border:none;

    background:#F5B4B0;

    color:white;

    padding:11px;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;
    font-weight:bold;
}

.update-btn{

    width:100%;

    margin-top:8px;

    border:none;

    background:#DDE8B3;

    color:#333;

    padding:11px;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;
    font-weight:bold;
}

#lastFeedInfo{

    background:#fafafa;

    padding:8px;

    border-radius:10px;

    text-align:center;

    margin-bottom:8px;

    font-size:13px;
}

.record{

    font-size:13px;

    padding:6px 0;

    border-bottom:1px solid #eee;
}

.record:last-child{
    border-bottom:none;
}

</style>
</head>

<body>

<div class="container">

<h1>🍼 寶寶餵奶紀錄</h1>

<div class="card">

    <div class="summary-row">

        <div class="summary-item">
            距上一餐：
            <span id="lastInterval">--</span>
        </div>

        <div class="summary-item">
            上一餐：
            <span id="lastDrinkAmount">--</span>
        </div>

    </div>

</div>

<div class="card">

    <div class="time-row">

        <div id="displayTime">
            --
        </div>

        <button
            id="add5Btn"
            class="small-btn">

            +5分鐘

        </button>

    </div>

    <input
        type="hidden"
        id="feedTime">

    <div class="section-title">
        餵奶方式
    </div>

    <div class="type-row">

        <button
            class="type-btn active"
            data-type="配方奶">
            配方奶
        </button>

        <button
            class="type-btn"
            data-type="瓶餵母奶">
            母奶
        </button>

        <button
            class="type-btn"
            data-type="親餵">
            親餵
        </button>

    </div>

    <input
        type="hidden"
        id="feedType"
        value="配方奶">

    <div class="section-title">
        奶量（ml）
    </div>

    <div class="milk-grid">

        <button class="milk-btn" data-ml="90">90</button>
        <button class="milk-btn" data-ml="120">120</button>
        <button class="milk-btn" data-ml="150">150</button>
        <button class="milk-btn" data-ml="180">180</button>

    </div>

    <input
        id="preparedAmount"
        type="number"
        placeholder="自訂奶量">

    <button
        id="saveBtn"
        class="save-btn">

        ✨ 開始餵奶

    </button>

</div>

<div class="card">

    <div class="section-title">
        補填上一餐剩餘量
    </div>

    <div id="lastFeedInfo">
        尚無資料
    </div>

    <div class="remain-grid">

        <button
            class="remain-btn"
            data-remain="30">
            30
        </button>

        <button
            class="remain-btn"
            data-remain="60">
            60
        </button>

        <button
            class="remain-btn"
            data-remain="90">
            90
        </button>

    </div>

    <input
        id="remainingAmount"
        type="number"
        placeholder="自訂剩餘量">

    <button
        id="updateRemainingBtn"
        class="update-btn">

        更新剩餘量

    </button>

</div>

<div class="card">

    <div class="section-title">
        最近紀錄
    </div>

    <div id="recordsContainer">

        載入中...

    </div>

</div>

</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
