<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍼 寶寶餵奶雲端紀錄</title>
  <style>
    :root {
      --bg-color: #fff9f5;
      --card-bg: #ffffff;
      --primary-pink: #ffb7b2;
      --primary-pink-hover: #ff9e99;
      --soft-blue: #e2f0cb;
      --text-main: #4a4a4a;
      --text-sub: #7d7d7d;
      --border-color: #ffe5d9;
      --danger-color: #ff8b94;
      --shadow: 0 4px 15px rgba(255, 183, 178, 0.15);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 10px 0 6px 0;
    }

    header h1 {
      font-size: 1.4rem;
      color: #5c6b73;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
    }

    /* 頂部即時摘要區塊 */
    .summary-card {
      background: linear-gradient(135deg, #ffe5d9 0%, #fff1e6 100%);
      border: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: center;
    }

    .stat-box h3 {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-box .number {
      font-size: 1.3rem;
      font-weight: bold;
      color: #d8707c;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .time-input-group {
      display: flex;
      gap: 8px;
    }

    input[type="datetime-local"], input[type="number"], select {
      width: 100%;
      height: 46px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0 12px;
      font-size: 1rem;
      outline: none;
      background-color: #faf9f6;
    }

    .btn-now {
      flex-shrink: 0;
      padding: 0 16px;
      height: 46px;
      background-color: var(--soft-blue);
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #556b2f;
      cursor: pointer;
    }

    .type-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .type-btn {
      height: 46px;
      border: 2px solid var(--border-color);
      background: #fff;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .type-btn.active {
      background-color: var(--primary-pink);
      color: white;
      border-color: var(--primary-pink);
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background-color: var(--primary-pink);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 183, 178, 0.4);
      margin-top: 6px;
    }

    /* 歷史紀錄卡片 */
    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: #faf9f6;
      border-radius: 12px;
      border-left: 5px solid var(--primary-pink);
      margin-bottom: 10px;
    }

    .record-info .type {
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #eaeaea;
      color: #555;
      margin-bottom: 4px;
      display: inline-block;
    }

    .record-info .time {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .record-amount {
      text-align: right;
    }

    .record-amount .value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #d8707c;
    }

    .btn-edit-leftover {
      background: #e3f2fd;
      color: #0d47a1;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 8px;
    }

    #sync-status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍼 寶寶餵奶紀錄 (雙機同步)</h1>
  </header>

  <!-- 上一次餵奶資訊卡片 -->
  <div class="card summary-card">
    <div class="stat-box">
      <h3>距離上一餐已過</h3>
      <div id="stat-time-ago" class="number">--</div>
    </div>
    <div class="stat-box">
      <h3>上一餐實際喝量</h3>
      <div id="stat-last-amount" class="number">--</div>
    </div>
  </div>

  <!-- 新增餵奶表單 -->
  <div class="card">
    <div class="form-group">
      <label>⏰ 餵奶時間</label>
      <div class="time-input-group">
        <input type="datetime-local" id="feedTime">
        <button type="button" class="btn-now" onclick="setNowTime()">現在</button>
      </div>
    </div>

    <div class="form-group">
      <label>🍼 餵奶方式</label>
      <div class="type-selector">
        <button type="button" class="type-btn active" data-type="配方奶" onclick="selectType('配方奶', this)">配方奶</button>
        <button type="button" class="type-btn" data-type="瓶餵母奶" onclick="selectType('瓶餵母奶', this)">瓶餵母奶</button>
        <button type="button" class="type-btn" data-type="親餵" onclick="selectType('親餵', this)">親餵</button>
      </div>
    </div>

    <div class="form-group" id="bottleInputGroup">
      <label for="totalAmount">🥛 準備/泡奶量 (ml)</label>
      <input type="number" id="totalAmount" placeholder="例如：150" inputmode="numeric">
    </div>

    <button type="button" class="btn-submit" onclick="saveRecord()">✨ 紀錄這餐</button>
  </div>

  <div id="sync-status">🔄 雲端資料同步中...</div>

  <!-- 歷史紀錄 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2>📜 歷史紀錄</h2>
      <button onclick="fetchRecords()" style="border:none; background:none; color:#0077b6; cursor:pointer;">🔄 重新整理</button>
    </div>
    <div id="recordList"></div>
  </div>

  <script>
    // ⚠️ 請填入你在 GAS 部署後取得的 Web 應用程式 URL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz1W8az-fIS9wJBWxQJryTICinfDVyJ4XmnKJ2gcj-Xx26ZX7kYJJHcwGYqq91OsoVX/exec';

    let currentType = '配方奶';
    let globalRecords = [];

    window.onload = function() {
      setNowTime();
      fetchRecords();
      // 每 30 秒自動向雲端同步一次資料，且每分鐘更新時間計時
      setInterval(fetchRecords, 30000);
      setInterval(updateHeaderSummary, 60000);
    };

    function setNowTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('feedTime').value = now.toISOString().slice(0, 16);
    }

    function selectType(type, btn) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('bottleInputGroup').style.display = (type === '親餵') ? 'none' : 'block';
    }

    // 從雲端抓取紀錄
    function fetchRecords() {
      document.getElementById('sync-status').innerText = '🔄 雲端同步中...';
      fetch(`${GAS_URL}?action=get`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            globalRecords = data.records;
            renderList();
            updateHeaderSummary();
            document.getElementById('sync-status').innerText = '✅ 已是最新雲端資料';
          }
        })
        .catch(err => {
          document.getElementById('sync-status').innerText = '⚠️ 同步失敗，請檢查網路';
        });
    }

    // 更新頂部「距離多久」與「上一餐喝多少」
    function updateHeaderSummary() {
      if (!globalRecords || globalRecords.length === 0) {
        document.getElementById('stat-time-ago').innerText = '--';
        document.getElementById('stat-last-amount').innerText = '--';
        return;
      }

      const lastRecord = globalRecords[0]; // 最新一筆
      const lastTime = new Date(lastRecord.timestamp);
      const now = new Date();
      const diffMs = now - lastTime;
      const diffMins = Math.floor(diffMs / (1000 * 60));
      const hours = Math.floor(diffMins / 60);
      const mins = diffMins % 60;

      let timeAgoStr = `${hours}小時 ${mins}分`;
      if (hours === 0) timeAgoStr = `${mins} 分鐘`;

      document.getElementById('stat-time-ago').innerText = timeAgoStr;

      if (lastRecord.type === '親餵') {
        document.getElementById('stat-last-amount').innerText = '親餵';
      } else {
        document.getElementById('stat-last-amount').innerText = `${lastRecord.actualAmount} ml`;
      }
    }

    // 儲存新紀錄
    function saveRecord() {
      const timeVal = document.getElementById('feedTime').value;
      const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;

      if (!timeVal) {
        alert('請選擇餵奶時間');
        return;
      }

      if (currentType !== '親餵' && totalAmount <= 0) {
        alert('請輸入準備/泡奶量');
        return;
      }

      const record = {
        id: Date.now(),
        timestamp: timeVal,
        type: currentType,
        totalAmount: totalAmount,
        leftAmount: 0,
        actualAmount: totalAmount
      };

      document.getElementById('sync-status').innerText = '⏳ 正在存入雲端...';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save', record: record })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('totalAmount').value = '';
        setNowTime();
        fetchRecords();
      });
    }

    // 補填/更新剩餘奶量
    function promptUpdateLeftover(id, currentTotal, currentLeft) {
      const input = prompt(`這餐準備了 ${currentTotal} ml，請輸入餵完後「剩餘的奶量 (ml)」：`, currentLeft);
      if (input !== null) {
        const leftAmount = parseFloat(input) || 0;
        document.getElementById('sync-status').innerText = '⏳ 更新中...';

        fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateLeftover', id: id, leftAmount: leftAmount })
        })
        .then(res => res.json())
        .then(data => {
          fetchRecords();
        });
      }
    }

    // 刪除紀錄
    function deleteRecord(id) {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        document.getElementById('sync-status').innerText = '⏳ 刪除中...';
        fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', id: id })
        })
        .then(res => res.json())
        .then(data => {
          fetchRecords();
        });
      }
    }

    // 渲染歷史列表
    function renderList() {
      const container = document.getElementById('recordList');
      container.innerHTML = '';

      if (globalRecords.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#888; padding:16px;">目前暫無紀錄</div>';
        return;
      }

      globalRecords.forEach(r => {
        const d = new Date(r.timestamp);
        const monthDay = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

        const card = document.createElement('div');
        card.className = 'record-item';

        let amountHtml = '';
        if (r.type === '親餵') {
          amountHtml = '<div class="value">親餵</div>';
        } else {
          amountHtml = `
            <div class="value">${r.actualAmount} <span style="font-size:0.8rem;">ml</span></div>
            <div style="font-size:0.75rem; color:#888;">(泡 ${r.totalAmount} / 剩 ${r.leftAmount})</div>
            <button class="btn-edit-leftover" onclick="promptUpdateLeftover(${r.id}, ${r.totalAmount}, ${r.leftAmount})">✏️ 記剩餘量</button>
          `;
        }

        card.innerHTML = `
          <div class="record-info">
            <span class="type">${r.type}</span>
            <div class="time">📅 ${monthDay} ${timeStr}</div>
          </div>
          <div style="display:flex; align-items:center;">
            <div class="record-amount">${amountHtml}</div>
            <button class="btn-delete" onclick="deleteRecord(${r.id})">🗑️</button>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
